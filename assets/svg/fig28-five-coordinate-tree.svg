<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420"><rect width="1000" height="420" fill="#fff"/><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}</style><text x="40" y="46" font-size="24" font-weight="700">五坐标嵌套分类：A 分层，B/D/E 子空间</text>
<text x="40" y="76" font-size="15" fill="#666">A = X 的量级（第一分岔）；子空间 B（𝒟 代数）× D（κ）× E（演化）= 75 格</text>
<rect x="60" y="120" width="210" height="180" rx="12" fill="#f7f9fc" stroke="#009E73" stroke-width="2.5"/>
<text x="165.0" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#009E73">A = 0 有限</text>
<text x="165.0" y="206" text-anchor="middle" font-size="17">7 领域</text>
<text x="165.0" y="240" text-anchor="middle" font-size="16" fill="#666">占据 20 / 75</text>
<rect x="90" y="260" width="150" height="14" rx="4" fill="#009E73" opacity="0.25"/>
<rect x="288" y="120" width="210" height="180" rx="12" fill="#f7f9fc" stroke="#3a6ea5" stroke-width="2.5"/>
<text x="393.0" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#3a6ea5">A = 1 可数</text>
<text x="393.0" y="206" text-anchor="middle" font-size="17">5 领域</text>
<text x="393.0" y="240" text-anchor="middle" font-size="16" fill="#666">占据 7 / 75</text>
<rect x="318" y="260" width="150" height="14" rx="4" fill="#3a6ea5" opacity="0.25"/>
<rect x="516" y="120" width="210" height="180" rx="12" fill="#f7f9fc" stroke="#b8862f" stroke-width="2.5"/>
<text x="621.0" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#b8862f">A = 2 稠密</text>
<text x="621.0" y="206" text-anchor="middle" font-size="17">15 领域</text>
<text x="621.0" y="240" text-anchor="middle" font-size="16" fill="#666">占据 30 / 75</text>
<rect x="546" y="260" width="150" height="14" rx="4" fill="#b8862f" opacity="0.25"/>
<rect x="744" y="120" width="210" height="180" rx="12" fill="#f7f9fc" stroke="#c94f4f" stroke-width="2.5"/>
<text x="849.0" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#c94f4f">A = 3 无限自由</text>
<text x="849.0" y="206" text-anchor="middle" font-size="17">1 领域</text>
<text x="849.0" y="240" text-anchor="middle" font-size="16" fill="#666">O16 禁区：EDS 不适用</text>
<rect x="774" y="260" width="150" height="14" rx="4" fill="#c94f4f" opacity="0.25"/>
<text x="60" y="350" font-size="16" fill="#1a1a1a">旧轴 1 把 A（X 量级）与 B（𝒟 代数）混在一起 ⇒ “拓扑×正×连续”等空缺是标签假象。</text>
<text x="60" y="380" font-size="16" fill="#1a1a1a">分开后：A=3 是理论上被排除的层；真正的空缺应在同一 A 层内寻找。</text></svg>