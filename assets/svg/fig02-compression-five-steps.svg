<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300">
<rect x="0" y="0" width="820" height="300" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="28" class="t" text-anchor="start" fill="#1a1a1a" font-weight="normal">压缩的五步操作法</text>
<rect x="30" y="90" width="140" height="90" rx="6" fill="#fafafa" stroke="#009E73" stroke-width="1.8"/>
<text x="100.0" y="125" class="l" text-anchor="middle" fill="#009E73" font-weight="700">1 识别冗余</text>
<text x="100.0" y="150" class="l" text-anchor="middle" fill="#666" font-weight="normal">五个判据扫描</text>
<line x1="170" y1="135" x2="190" y2="135" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="190" y="90" width="140" height="90" rx="6" fill="#fafafa" stroke="#009E73" stroke-width="1.8"/>
<text x="260.0" y="125" class="l" text-anchor="middle" fill="#009E73" font-weight="700">2 构造抽象</text>
<text x="260.0" y="150" class="l" text-anchor="middle" fill="#666" font-weight="normal">基本对象=关系/区分</text>
<line x1="330" y1="135" x2="350" y2="135" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="350" y="90" width="140" height="90" rx="6" fill="#fafafa" stroke="#009E73" stroke-width="1.8"/>
<text x="420.0" y="125" class="l" text-anchor="middle" fill="#009E73" font-weight="700">3 重定义概念</text>
<text x="420.0" y="150" class="l" text-anchor="middle" fill="#666" font-weight="normal">原概念成导出概念</text>
<line x1="490" y1="135" x2="510" y2="135" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="510" y="90" width="140" height="90" rx="6" fill="#fafafa" stroke="#009E73" stroke-width="1.8"/>
<text x="580.0" y="125" class="l" text-anchor="middle" fill="#009E73" font-weight="700">4 重述定理</text>
<text x="580.0" y="150" class="l" text-anchor="middle" fill="#666" font-weight="normal">原定理成特例</text>
<line x1="650" y1="135" x2="670" y2="135" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="670" y="90" width="140" height="90" rx="6" fill="#fafafa" stroke="#b8862f" stroke-width="1.8"/>
<text x="740.0" y="125" class="l" text-anchor="middle" fill="#b8862f" font-weight="700">5 检验有效性</text>
<text x="740.0" y="150" class="l" text-anchor="middle" fill="#666" font-weight="normal">P1—P4 四判据</text>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="6" orient="auto"><path d="M0,0 L5,6 L10,0" fill="none" stroke="#666"/></marker></defs>
<path d="M100.0,180 C100.0,260 740.0,260 740.0,180" fill="none" stroke="#c94f4f" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="400" y="288" class="l" text-anchor="middle" fill="#c94f4f" font-weight="normal">若不通过 P3（问题解决力）→ 回到步骤 1，换更贴的抽象</text>
</svg>
