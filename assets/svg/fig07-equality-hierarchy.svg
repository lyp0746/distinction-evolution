<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300">
<rect x="0" y="0" width="740" height="300" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="28" class="t" text-anchor="start" fill="#1a1a1a" font-weight="normal">相等的层级：从布尔判断到路径空间</text>
<rect x="60" y="90" width="250" height="150" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4"/>
<text x="185" y="118" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="700" font-size="13px">集合论</text>
<text x="185" y="160" class="l" text-anchor="middle" fill="#3a6ea5" font-weight="700" font-size="16px">a = b</text>
<text x="185" y="190" class="l" text-anchor="middle" fill="#666" font-weight="normal">布尔判断：真或假</text>
<rect x="430" y="90" width="250" height="150" rx="6" fill="#fafafa" stroke="#009E73" stroke-width="1.4"/>
<text x="555" y="118" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="700" font-size="13px">同伦类型论</text>
<text x="555" y="155" class="l" text-anchor="middle" fill="#009E73" font-weight="700" font-size="14px">a ──p──► b</text>
<text x="555" y="180" class="l" text-anchor="middle" fill="#666" font-weight="normal">p: a=b 是路径</text>
<text x="555" y="202" class="l" text-anchor="middle" fill="#666" font-weight="normal">路径之间还有路径（同伦）</text>
<text x="555" y="224" class="l" text-anchor="middle" fill="#b8862f" font-weight="700">……无穷上升</text>
<line x1="310" y1="165" x2="430" y2="165" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="6" orient="auto"><path d="M0,0 L5,6 L10,0" fill="none" stroke="#666"/></marker></defs>
<text x="370" y="155" class="l" text-anchor="middle" fill="#666" font-weight="normal">结构化</text>
<text x="370" y="275" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="700">单价公理：同构即相等（结构主义）</text>
</svg>
