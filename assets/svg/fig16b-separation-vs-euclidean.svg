<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
<rect x="0" y="0" width="800" height="320" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="28" class="t" text-anchor="start" fill="#1a1a1a" font-weight="normal">分离度量与欧氏度量的差别</text>
<line x1="60" y1="280" x2="380" y2="280" class="ax"/>
<line x1="60" y1="280" x2="60" y2="60" class="ax"/>
<text x="220.0" y="314" class="l" text-anchor="middle">x</text>
<text x="50" y="170.0" class="l" text-anchor="middle" transform="rotate(-90 50 170.0)">y</text>
<circle cx="150" cy="150" r="6" fill="#3a6ea5"/>
<circle cx="290" cy="150" r="6" fill="#3a6ea5"/>
<line x1="150" y1="150" x2="290" y2="150" stroke="#666" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="220" y="140" class="l" text-anchor="middle" fill="#666" font-weight="normal">欧氏距离</text>
<ellipse cx="220" cy="150" rx="20" ry="10" fill="none" stroke="#b8862f" stroke-width="1" opacity="0.50"/>
<ellipse cx="220" cy="150" rx="42" ry="21" fill="none" stroke="#b8862f" stroke-width="1" opacity="0.44"/>
<ellipse cx="220" cy="150" rx="64" ry="32" fill="none" stroke="#b8862f" stroke-width="1" opacity="0.38"/>
<ellipse cx="220" cy="150" rx="86" ry="43" fill="none" stroke="#b8862f" stroke-width="1" opacity="0.32"/>
<ellipse cx="220" cy="150" rx="108" ry="54" fill="none" stroke="#b8862f" stroke-width="1" opacity="0.26"/>
<ellipse cx="220" cy="150" rx="130" ry="65" fill="none" stroke="#b8862f" stroke-width="1" opacity="0.20"/>
<text x="220" y="100" class="l" text-anchor="middle" fill="#b8862f" font-weight="700">分离难度等值线</text>
<text x="220" y="300" class="l" text-anchor="middle" fill="#666" font-weight="normal">欧氏：两点越远越不同</text>
<rect x="440" y="70" width="320" height="190" rx="6" fill="#fff6ee" stroke="#b8862f" stroke-width="1.6"/>
<text x="600" y="98" class="l" text-anchor="middle" fill="#b8862f" font-weight="700" font-size="13px">分离度量 d_D(x,y)</text>
<text x="470" y="128" class="l" text-anchor="start" fill="#666" font-weight="normal">inf{ α : x ∼_α y }</text>
<text x="470" y="154" class="l" text-anchor="start" fill="#1a1a1a" font-weight="normal">= 把两点变得不可区分所需的最小精度</text>
<text x="470" y="180" class="l" text-anchor="start" fill="#666" font-weight="normal">在信息几何中 ≈ KL 散度的二阶展开</text>
<text x="470" y="206" class="l" text-anchor="start" fill="#666" font-weight="normal">在流形上通过热核与曲率相联系</text>
<text x="470" y="232" class="l" text-anchor="start" fill="#666" font-weight="normal">全局含义可能与欧氏不同（→ 1/3 缺口）</text>
</svg>
