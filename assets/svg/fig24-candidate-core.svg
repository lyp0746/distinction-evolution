<line x1="775" y1="340" x2="500" y2="250" stroke="#c94f4f" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6"/>
<rect x="250" y="450" width="500" height="72" rx="10" fill="#f4fbf7" stroke="#009E73" stroke-width="2"/>
<text x="500" y="480" text-anchor="middle" font-size="18" font-weight="700" fill="#009E73">硬核：有限图上的两阶段相变（唯一完全兑现，A）</text>
