<line x1="775" y1="150" x2="500" y2="250" stroke="#b8862f" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6"/>
<rect x="110" y="300" width="230" height="80" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/><text x="225.0" y="334.0" text-anchor="middle" font-size="22" font-weight="600" fill="#009E73">演化规则</text><text x="225.0" y="362.0" text-anchor="middle" font-size="15" fill="#666">演化流 Φ</text>
