<text x="500" y="272" text-anchor="middle" font-size="16" fill="#666">候选（B—C）</text>
<rect x="110" y="110" width="230" height="80" rx="10" fill="#ffffff" stroke="#3a6ea5" stroke-width="2"/><text x="225.0" y="144.0" text-anchor="middle" font-size="22" font-weight="600" fill="#3a6ea5">基本对象</text><text x="225.0" y="172.0" text-anchor="middle" font-size="15" fill="#666">区分动作 𝒟</text>
